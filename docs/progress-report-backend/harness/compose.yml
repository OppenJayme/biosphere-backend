# Disposable SRS audit stack. Nothing here uses a named volume: data lives in
# tmpfs and is gone after `down`. Every port is bound to loopback only.
# Images are the ones already present locally; compose never pulls.
name: biosphere-srs-audit

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.004
    pull_policy: never
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
      JWT_SECRET: ${AUDIT_JWT_SECRET}
      JWT_EXP: 3600
    tmpfs:
      - /var/lib/postgresql/data:rw,size=1g
    ports:
      - "127.0.0.1:18399:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 60

  mail:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    pull_policy: never
    ports:
      - "127.0.0.1:18398:8025"

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    pull_policy: never
    profiles: ["app"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:18397/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUDIT_DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "http://localhost:3000/**"
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${AUDIT_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: audit@example.invalid
      GOTRUE_SMTP_SENDER_NAME: audit
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 10000
      GOTRUE_RATE_LIMIT_VERIFY: 10000
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 10000
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "false"
    ports:
      - "127.0.0.1:18396:9999"

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.82.1
    pull_policy: never
    profiles: ["app"]
    environment:
      ANON_KEY: ${AUDIT_ANON_KEY}
      SERVICE_KEY: ${AUDIT_SERVICE_KEY}
      AUTH_JWT_SECRET: ${AUDIT_JWT_SECRET}
      PGRST_JWT_SECRET: ${AUDIT_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${AUDIT_DB_PASSWORD}@db:5432/postgres
      POSTGREST_URL: http://127.0.0.1:9
      FILE_SIZE_LIMIT: 104857600
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /tmp/audit-storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    tmpfs:
      - /tmp/audit-storage:rw,size=512m,uid=1000
    ports:
      - "127.0.0.1:18395:5000"
