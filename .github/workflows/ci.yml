name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify Swagger JSON and YAML compatibility
        run: npm run verify:swagger-yaml

      - name: Verify CSV parser compatibility and prototype safety
        run: npm run verify:csv-parser

      - name: Verify synthetic recovery CLI argument guards
        run: npm run test:recovery:guards

      - name: E2E tests
        run: npm run test:e2e

      - name: Isolated curator FAQ content evaluation
        run: npm run evaluate:faq:curator
