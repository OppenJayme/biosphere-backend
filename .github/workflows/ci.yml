name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify Swagger JSON and YAML compatibility
        run: npm run verify:swagger-yaml

      - name: Verify CSV parser compatibility and prototype safety
        run: npm run verify:csv-parser

      - name: Verify pinned Storage response contract without services
        run: npm run test:recovery:supabase:contracts

      - name: Verify durable checkpoint files and pre-target rejection
        run: npm run test:recovery:supabase:files

      - name: Verify synthetic recovery CLI argument guards
        run: npm run test:recovery:guards

      - name: E2E tests
        run: npm run test:e2e

      - name: Isolated curator FAQ content evaluation
        run: npm run evaluate:faq:curator

      - name: Verify local recovery-readiness planning checks
        run: npm run test:recovery:readiness

  synthetic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout synthetic rehearsal source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for owned recovery checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull the reviewed PostgreSQL image by digest
        run: docker pull postgres@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb

      - name: Real synthetic capture, restore and failure checks
        env:
          RUN_RECOVERY_REHEARSAL: 'true'
        run: node --test test/recovery-cli.test.cjs

      - name: Install dependencies for isolated recorder checks
        env:
          # Code generation only; fixture commands create their own databases.
          DIRECT_URL: postgresql://synthetic:synthetic@127.0.0.1:1/synthetic
        run: npm ci

      - name: Real recorder, notification isolation and slow retry checks
        run: npm run test:recovery-history:db

      - name: Real Prisma accession allocation regression
        run: npm run test:accession-allocation:db

      - name: Real engine, recorder and same-ID reconciliation checks
        run: npm run test:recovery-recording:db

      - name: Build the separate worker runtime
        run: npm run build

      - name: Real child-process worker and guarded history destination checks
        run: npm run test:recovery-worker:db
